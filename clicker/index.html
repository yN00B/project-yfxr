<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YFXR Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .column {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 25px;
            transition: all 0.3s ease;
        }
        #left-col {
            flex: 1;
            background-color: #000000;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #111111;
            text-align: center;
            position: relative;
        }
        #mid-col {
            flex: 1.2;
            background-color: #020202;
            border-right: 2px solid #111111;
            overflow-y: auto;
        }
        #right-col {
            flex: 1.3;
            background-color: #000000;
            overflow-y: auto;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 5px #00ffcc, 0 0 15px #00ffcc, 0 0 30px #00ffcc;
            font-weight: 900;
            letter-spacing: 2px;
        }
        h2 {
            padding-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
            border-bottom: 1px solid #111111;
            font-weight: 700;
        }
        h3 {
            color: #9933ff;
            text-shadow: 0 0 8px rgba(153, 51, 255, 0.6);
        }
        .counter-container {
            margin-bottom: 40px;
        }
        .score {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .cps {
            font-size: 1.1rem;
            color: #888888;
            margin-top: 5px;
        }
        .click-container {
            position: relative;
            width: 260px;
            height: 260px;
        }
        .click-target {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1), inset 0 0 15px rgba(0, 255, 204, 0.05);
            border: 2px solid #00ffcc;
            overflow: hidden;
        }
        .click-target:hover {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4), inset 0 0 20px rgba(0, 255, 204, 0.1);
            transform: scale(1.02);
        }
        .click-target:active {
            transform: scale(0.92);
        }
        .click-target img {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }
        .click-target-text {
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc;
            letter-spacing: 1px;
        }
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            animation: explode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes explode {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
        .shop-item {
            display: flex;
            align-items: center;
            background-color: #050505;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s, border-color 0.3s, box-shadow 0.3s;
            border: 1px solid #111111;
        }
        .shop-item:hover:not(.disabled) {
            background-color: #0a0a0f;
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
            transform: translateY(-2px);
        }
        .shop-item:active:not(.disabled) {
            transform: translateY(0);
        }
        .shop-item.disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .item-img {
            width: 52px;
            height: 52px;
            background-color: #000000;
            margin-right: 15px;
            border-radius: 8px;
            border: 1px solid #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-info {
            flex-grow: 1;
        }
        .item-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffffff;
            transition: color 0.3s;
        }
        .shop-item:hover:not(.disabled) .item-name {
            color: #00ffcc;
        }
        .item-cost {
            color: #ffd700;
            font-size: 0.95rem;
            margin-top: 2px;
        }
        .item-count {
            font-size: 1.6rem;
            font-weight: 800;
            color: #333333;
            margin-left: 10px;
            transition: color 0.3s;
        }
        .shop-item:hover:not(.disabled) .item-count {
            color: #00ffcc;
        }
        .prestige-box {
            background: #030107;
            border: 1px solid #221133;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .prestige-box:hover {
            border-color: #9933ff;
            box-shadow: 0 0 15px rgba(153, 51, 255, 0.15);
        }
        .prestige-btn {
            background-color: transparent;
            color: #9933ff;
            border: 2px solid #9933ff;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            text-shadow: 0 0 5px rgba(153, 51, 255, 0.5);
            box-shadow: 0 0 10px rgba(153, 51, 255, 0.1);
        }
        .prestige-btn:hover:not(:disabled) {
            background-color: #9933ff;
            color: #ffffff;
            box-shadow: 0 0 20px #9933ff;
            transform: scale(1.03);
        }
        .prestige-btn:disabled {
            border-color: #222222;
            color: #444444;
            text-shadow: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #111111;
            font-size: 0.95rem;
            color: #aaaaaa;
        }
        .stat-line span:last-child {
            color: #ffffff;
            font-weight: 500;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #111111;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #222222;
        }
    </style>
</head>
<body>

    <div class="column" id="left-col">
        <h1>YFXR Clicker</h1>
        <div class="counter-container">
            <div class="score"><span id="points">0</span> YFXR</div>
            <div class="cps">per second: <span id="cps">0</span></div>
        </div>
        <div class="click-container">
            <div class="click-target" id="click-target">
                <img src="https://i.ibb.co/fzY2zBTF/6.png" alt="YFXR" id="click-img" onerror="this.style.display='none'; document.getElementById('fallback-text').style.display='block';">
                <div class="click-target-text" id="fallback-text" style="display:none;">CLICK ME</div>
            </div>
        </div>
    </div>

    <div class="column" id="mid-col">
        <h2>Stats & Progression</h2>
        
        <div class="prestige-box">
            <h3>Prestige System</h3>
            <p>Current Prestige Multiplier: <span id="prestige-mult">100</span>%</p>
            <p>Current Prestige Level: <span id="prestige-level">0</span> / 10</p>
            <p>Prestige Levels waiting: <span id="pending-prestige">0</span></p>
            <button class="prestige-btn" id="prestige-btn" disabled>Ascend</button>
        </div>

        <h3>Statistics</h3>
        <div class="stat-line"><span>Total YFXR Gained:</span><span id="stat-total">0</span></div>
        <div class="stat-line"><span>Total Clicks:</span><span id="stat-clicks">0</span></div>
        <div class="stat-line"><span>Time Elapsed:</span><span id="stat-time">0s</span></div>
    </div>

    <div class="column" id="right-col">
        <h2>Shop</h2>
        <div id="shop-container"></div>
    </div>

    <script>
        let game = {
            points: 0,
            totalPointsEarned: 0,
            totalClicks: 0,
            prestigeLevel: 0,
            timeElapsed: 0,
            itemCounts: [0, 0, 0, 0, 0]
        };

        const baseItems = [
            { id: 0, name: "Auto-Scraper",  baseCost: 15,    cps: 0.1,  img: "https://i.ibb.co/LXvPwtNr/Screenshot-2026-06-01-at-16-59-16.png" },
            { id: 1, name: "YFXR Drone",    baseCost: 100,   cps: 1,    img: "https://i.ibb.co/tPCswZpp/Screenshot-2026-06-01-at-17-00-07.png" },
            { id: 2, name: "Mining Rig",    baseCost: 1100,  cps: 8,    img: "https://i.ibb.co/gMrBnhg9/Screenshot-2026-06-01-at-17-00-54.png" },
            { id: 3, name: "Quantum Farm",  baseCost: 12000, cps: 47,   img: "https://i.ibb.co/cGmccxV/Screenshot-2026-06-01-at-17-02-07.png" },
            { id: 4, name: "Singularity",   baseCost: 130000,cps: 260,  img: "https://i.ibb.co/nMQXQLVQ/Screenshot-2026-06-01-at-17-03-17.png" }
        ];

        function getCost(itemIndex) {
            return Math.floor(baseItems[itemIndex].baseCost * Math.pow(1.15, game.itemCounts[itemIndex]));
        }

        function getPrestigeMultiplier() {
            return 1 + (game.prestigeLevel * 0.15);
        }

        function calculateCps() {
            let baseCps = 0;
            for(let i=0; i<baseItems.length; i++) {
                baseCps += game.itemCounts[i] * baseItems[i].cps;
            }
            return baseCps * getPrestigeMultiplier();
        }

        function calculatePendingPrestige() {
            if (game.totalPointsEarned < 1000000) return 0;
            let totalPrestigeEarned = Math.floor(Math.sqrt(game.totalPointsEarned / 1000000));
            let pending = totalPrestigeEarned - game.prestigeLevel;
            return pending > 0 ? pending : 0;
        }

        function checkWinCondition() {
            if (game.prestigeLevel >= 10) {
                localStorage.removeItem("yfxr_clicker_save");
                window.location.href = "https://yfxr.qzz.io/winner/";
            }
        }

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + " Billion";
            if (num >= 1e6) return (num / 1e6).toFixed(2) + " Million";
            return Math.floor(num).toLocaleString();
        }

        function updateDisplay() {
            document.getElementById("points").innerText = formatNumber(game.points);
            document.getElementById("cps").innerText = formatNumber(calculateCps());
            
            document.getElementById("stat-total").innerText = formatNumber(game.totalPointsEarned);
            document.getElementById("stat-clicks").innerText = game.totalClicks.toLocaleString();
            document.getElementById("stat-time").innerText = game.timeElapsed + "s";
            
            let pending = calculatePendingPrestige();
            document.getElementById("prestige-mult").innerText = Math.round(getPrestigeMultiplier() * 100);
            document.getElementById("prestige-level").innerText = game.prestigeLevel;
            document.getElementById("pending-prestige").innerText = pending;
            
            let prestigeBtn = document.getElementById("prestige-btn");
            if (pending > 0) {
                prestigeBtn.disabled = false;
                prestigeBtn.innerText = `Ascend (+${pending} Level${pending > 1 ? 's' : ''})`;
            } else {
                prestigeBtn.disabled = true;
                prestigeBtn.innerText = "Ascend (Requires 1M total YFXR)";
            }

            baseItems.forEach((item, index) => {
                let cost = getCost(index);
                let element = document.getElementById(`shop-item-${index}`);
                if (element) {
                    document.getElementById(`cost-${index}`).innerText = formatNumber(cost);
                    document.getElementById(`count-${index}`).innerText = game.itemCounts[index];
                    
                    if (game.points >= cost) {
                        element.classList.remove("disabled");
                    } else {
                        element.classList.add("disabled");
                    }
                }
            });
        }

        function buildShop() {
            const container = document.getElementById("shop-container");
            container.innerHTML = "";
            baseItems.forEach((item, index) => {
                let div = document.createElement("div");
                div.className = "shop-item disabled";
                div.id = `shop-item-${index}`;
                div.onclick = () => buyItem(index);
                
                div.innerHTML = `
                    <div class="item-img">
                        <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none';">
                    </div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-cost">Cost: <span id="cost-${index}">${item.baseCost}</span></div>
                    </div>
                    <div class="item-count" id="count-${index}">0</div>
                `;
                container.appendChild(div);
            });
        }

        function buyItem(index) {
            let cost = getCost(index);
            if (game.points >= cost) {
                game.points -= cost;
                game.itemCounts[index]++;
                updateDisplay();
                saveGame();
            }
        }

        function createParticles(e) {
            const target = document.getElementById("click-target");
            const rect = target.getBoundingClientRect();
            
            let clickX, clickY;
            if (e.clientX && e.clientY) {
                clickX = e.clientX - rect.left;
                clickY = e.clientY - rect.top;
            } else {
                clickX = rect.width / 2;
                clickY = rect.height / 2;
            }

            const colors = ['#00ffcc', '#00ffaa', '#00ffff', '#ffffff', '#9933ff'];
            const particleCount = 12;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement("div");
                particle.className = "particle";
                
                particle.style.left = `${clickX}px`;
                particle.style.top = `${clickY}px`;
                
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 10px ${particle.style.background}`;

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 80 + 40;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);

                target.parentNode.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 600);
            }
        }

        document.getElementById("click-target").onclick = function(e) {
            let clickValue = 1 * getPrestigeMultiplier();
            game.points += clickValue;
            game.totalPointsEarned += clickValue;
            game.totalClicks++;
            createParticles(e);
            updateDisplay();
        };

        document.getElementById("prestige-btn").onclick = function() {
            let pending = calculatePendingPrestige();
            if (pending > 0) {
                game.prestigeLevel += pending;
                game.points = 0;
                game.itemCounts = [0, 0, 0, 0, 0];
                checkWinCondition();
                updateDisplay();
                saveGame();
            }
        };

        setInterval(function() {
            let cps = calculateCps();
            let addedPoints = cps / 10;
            game.points += addedPoints;
            game.totalPointsEarned += addedPoints;
            updateDisplay();
        }, 100);

        setInterval(function() {
            game.timeElapsed++;
            saveGame();
        }, 1000);

        function saveGame() {
            localStorage.setItem("yfxr_clicker_save", JSON.stringify(game));
        }

        function loadGame() {
            let saved = localStorage.getItem("yfxr_clicker_save");
            if (saved) {
                let parsed = JSON.parse(saved);
                if(parsed.points !== undefined) game.points = parsed.points;
                if(parsed.totalPointsEarned !== undefined) game.totalPointsEarned = parsed.totalPointsEarned;
                if(parsed.totalClicks !== undefined) game.totalClicks = parsed.totalClicks;
                if(parsed.prestigeLevel !== undefined) game.prestigeLevel = parsed.prestigeLevel;
                if(parsed.timeElapsed !== undefined) game.timeElapsed = parsed.timeElapsed;
                if(parsed.itemCounts !== undefined) game.itemCounts = parsed.itemCounts;
            }
            checkWinCondition();
            buildShop();
            updateDisplay();
        }

        window.onload = function() {
            loadGame();
        };
    </script>
</body>
</html>
