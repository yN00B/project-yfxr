<!DOCTYPE html>
<html lang="en">
<head>
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
    --bg: #080808;
    --bg-secondary: #101010;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --text-muted: #8a8a8a;
    --accent: #ffffff;
    --glow: rgba(255,255,255,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top,
            rgba(255,255,255,.08),
            transparent 40%),
        #050505;
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:60px 20px;
}

.container{
    width:100%;
    max-width:750px;
}

header{
    text-align:center;
    margin-bottom:40px;
}

h1{
    font-size:3rem;
    font-weight:700;
    letter-spacing:-2px;
    background:linear-gradient(
        180deg,
        #ffffff,
        #bdbdbd
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

header p{
    margin-top:10px;
    color:var(--text-muted);
    font-size:1rem;
}

#search{
    width:100%;
    height:60px;
    padding:0 24px;
    border-radius:18px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(20px);
    color:white;
    font-size:1rem;
    outline:none;
    transition:.3s ease;
    margin-bottom:25px;
}

#search:focus{
    border-color:rgba(255,255,255,.25);
    box-shadow:
        0 0 0 4px rgba(255,255,255,.03),
        0 10px 40px rgba(255,255,255,.05);
}

ul{
    list-style:none;
}

.file-item{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:20px 24px;
    margin-bottom:14px;

    background:var(--card);
    backdrop-filter:blur(24px);

    border:1px solid var(--border);
    border-radius:20px;

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.file-item:hover{
    transform:translateY(-4px);
    border-color:rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);

    box-shadow:
        0 15px 40px rgba(0,0,0,.4),
        0 0 40px rgba(255,255,255,.03);
}

.file-item span{
    font-weight:500;
    font-size:0.95rem;
}

.file-item a{
    text-decoration:none;
    color:#000;

    background:white;
    padding:10px 18px;
    border-radius:12px;

    font-weight:600;
    transition:.25s ease;
}

.file-item a:hover{
    transform:scale(1.05);
    box-shadow:
        0 10px 25px rgba(255,255,255,.15);
}

.loader{
    text-align:center;
    color:var(--text-muted);
    padding:50px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.file-item{
    animation:fadeIn .4s ease forwards;
}
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Downloads</h1>
        <p style="color: var(--text-dim);">Select a file to download.</p>
    </header>

    <input type="text" id="search" placeholder="Search files...">

    <div id="file-list-container">
        <div class="loader">Loading files...</div>
    </div>
</div>

<script>
    const repo = "yn00b/yn00b.github.io";
    const path = "files";
    const fileListContainer = document.getElementById("file-list-container");
    const searchInput = document.getElementById("search");
    let allFiles = [];

    async function loadFiles() {
        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
            if (!res.ok) throw new Error("Failed to fetch");
            allFiles = await res.json();
            renderFiles(allFiles);
        } catch (err) {
            fileListContainer.innerHTML = "<div class='loader'>Unable to load files.</div>";
        }
    }

    function renderFiles(files) {
        fileListContainer.innerHTML = "";
        const ul = document.createElement("ul");

        files.filter(f => f.type === "file").forEach(file => {
            const li = document.createElement("li");
            li.className = "file-item";
            li.innerHTML = `
                <span>${file.name}</span>
                <a href="${file.download_url}" target="_blank">Download</a>
            `;
            ul.appendChild(li);
        });

        fileListContainer.appendChild(ul);
    }

    searchInput.addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allFiles.filter(f => f.name.toLowerCase().includes(term));
        renderFiles(filtered);
    });

    loadFiles();
</script>

</body>
</html>
