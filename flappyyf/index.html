<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1260181185811054"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>YFXR Flappy</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #121212; 
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { 
            display: block; 
            image-rendering: pixelated; 
            width: 100vw; height: 100vh;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const CONFIG = {
        birdImg: 'https://i.ibb.co/FkjWF00t/image.png', 
        pillarImg: 'https://i.ibb.co/Jwz1RwW4/image.png',
        bgImg: 'https://i.redd.it/5izxq4vpaisa1.gif', 
        birdColor: '#FFFFFF', 
        fallbackPillar: '#FFFFFF', 
        backgroundColor: '#121212',
        textColor: '#FFFFFF',
        accentColor: '#FFFFFF'
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if(type === 'jump') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if(type === 'score') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if(type === 'die') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    let assets = { bird: new Image(), pillar: new Image(), bg: new Image() };
    let assetsLoaded = { bird: false, pillar: false, bg: false };
    
    if (CONFIG.birdImg) {
        assets.bird.src = CONFIG.birdImg;
        assets.bird.onload = () => { assetsLoaded.bird = true; };
    }
    
    assets.pillar.src = CONFIG.pillarImg;
    assets.pillar.onload = () => { assetsLoaded.pillar = true; };
    
    if (CONFIG.bgImg) {
        assets.bg.src = CONFIG.bgImg;
        assets.bg.onload = () => { assetsLoaded.bg = true; };
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let birdY = canvas.height / 2;
    let birdX = 100;
    let velocity = 0;
    let gravity = 0.3;
    let jumpStrength = -7;
    let score = 0;
    let gameRunning = true;
    let gameOverAlpha = 0; 
    let pipes = [];
    let gameSpeed = 5; 
    const pipeWidth = 80;
    const pipeGap = 250;

    function createPipe() {
        let minHeight = 100;
        let maxHeight = canvas.height - pipeGap - 100;
        let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        pipes.push({ x: canvas.width, top: height, scored: false });
    }

    function update() {
        if (!gameRunning) {
            if (gameOverAlpha < 1) gameOverAlpha += 0.05;
            return;
        }

        velocity += gravity;
        birdY += velocity;

        gameSpeed = 5 + (score * 0.05);

        if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 400) {
            createPipe();
        }

        for (let i = 0; i < pipes.length; i++) {
            pipes[i].x -= gameSpeed;

            if (birdX + 40 > pipes[i].x && birdX < pipes[i].x + pipeWidth && (birdY < pipes[i].top || birdY + 40 > pipes[i].top + pipeGap)) {
                gameRunning = false;
                playSound('die');
            }

            if (!pipes[i].scored && pipes[i].x < birdX) {
                score++;
                pipes[i].scored = true;
                playSound('score');
            }
        }

        if (pipes.length > 0 && pipes[0].x < -pipeWidth) pipes.shift();
        if (birdY + 40 > canvas.height || birdY < 0) { gameRunning = false; playSound('die'); }
    }

    function draw() {
        if (assetsLoaded.bg) {
            ctx.drawImage(assets.bg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = CONFIG.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.fillStyle = CONFIG.fallbackPillar;
        for (let i = 0; i < pipes.length; i++) {
            if (assetsLoaded.pillar) {
                ctx.save();
                ctx.scale(1, -1);
                ctx.drawImage(assets.pillar, pipes[i].x, -pipes[i].top, pipeWidth, pipes[i].top);
                ctx.restore();
                ctx.drawImage(assets.pillar, pipes[i].x, pipes[i].top + pipeGap, pipeWidth, canvas.height - (pipes[i].top + pipeGap));
            } else {
                ctx.fillRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
                ctx.fillRect(pipes[i].x, pipes[i].top + pipeGap, pipeWidth, canvas.height - (pipes[i].top + pipeGap));
            }
        }

        if (assetsLoaded.bird) {
            ctx.drawImage(assets.bird, birdX, birdY, 40, 40);
        } else {
            ctx.fillStyle = CONFIG.birdColor;
            ctx.fillRect(birdX, birdY, 40, 40);
        }

        ctx.fillStyle = CONFIG.textColor;
        ctx.font = "bold 60px Arial";
        ctx.textAlign = "center";
        ctx.fillText(score, canvas.width / 2, 100);

        if (!gameRunning) {
            ctx.fillStyle = `rgba(255, 255, 255, ${gameOverAlpha * 0.1})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = `rgba(255, 255, 255, ${gameOverAlpha})`;
            ctx.font = "bold 40px Arial";
            ctx.fillText("CLICK TO RESTART", canvas.width / 2, canvas.height / 2);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener("mousedown", () => {
        if (!gameRunning) {
            birdY = canvas.height / 2;
            velocity = 0;
            pipes = [];
            score = 0;
            gameSpeed = 5;
            gameRunning = true;
            gameOverAlpha = 0;
        } else {
            velocity = jumpStrength;
            playSound('jump');
        }
    });

    loop();
</script>
</body>
</html>
