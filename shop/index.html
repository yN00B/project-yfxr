<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1260181185811054"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YFXR | useless stuff shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --accent: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Content */
        header {
            text-align: center;
            padding: 80px 20px 40px;
        }

        h1 { font-weight: 600; letter-spacing: -2px; font-size: 2.5rem; margin: 0; }
        p { color: var(--text-dim); margin-top: 10px; }

        .shop-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 40px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s ease;
        }

        .item:hover {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.06);
            transform: translateY(-5px);
        }

        .item img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .item h3 { margin: 0 0 15px 0; font-weight: 500; }

        .buy-btn {
            margin-top: auto;
            padding: 12px;
            background: white;
            color: black;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }

        .buy-btn:hover { opacity: 0.9; }

        /* Modal */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: #111;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div id="loadingScreen">
    <div class="loader"></div>
</div>

<header>
    <h1>YFXR</h1>
    <p>Useless Stuff that you certainly wont need!</p>
</header>

<div class="shop-container" id="shop">
    <div class="item"><img src="https://www.thoughtco.com/thmb/FXYrvZ9k0BynopNHwr62zkY01hE=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Toothpick-59f86d44aad52b0010170006.jpg"/><h3>used toothpick</h3><a class="buy-btn" onclick="openModal()">Purchase</a></div>
    <div class="item"><img src=""/><h3>something</h3><a class="buy-btn" onclick="openModal()">Purchase</a></div>
    <div class="item"><img src=""/><h3>some something</h3><a class="buy-btn" onclick="openModal()">Purchase</a></div>
</div>

<div class="modal-bg" id="modalBg">
    <div class="modal">
        <div class="close-btn" onclick="closeModal()">✕</div>
        <h2>Ready to buy?</h2>
        <p>Message <strong>YFXR</strong> on Discord to complete your transaction.</p>
    </div>
</div>

<script>
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('loadingScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('loadingScreen').style.display = 'none', 500);
            
            const shop = document.getElementById('shop');
            shop.style.opacity = '1';
            shop.style.transform = 'translateY(0)';
        }, 1000);
    };

    function openModal() { document.getElementById('modalBg').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalBg').style.display = 'none'; }
</script>

</body>
</html>
