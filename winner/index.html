<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YFXR Clicker - Winner!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #000000;
            background-image: url('https://i.pinimg.com/originals/b0/b9/6c/b0b96c8289ceb8aaac94aa5c9e0e8ebf.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            animation: fadeIn 1.5s ease forwards;
        }
        h1 {
            font-size: 5rem;
            font-weight: 900;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #00ffcc, 0 0 80px #00ffcc;
            animation: pulse 2s infinite alternate;
        }
        p {
            color: #ffffff;
            font-size: 1.5rem;
            margin-top: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #9933ff;
            text-decoration: none;
            background: transparent;
            border: 2px solid #9933ff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(153, 51, 255, 0.5);
            box-shadow: 0 0 15px rgba(153, 51, 255, 0.2);
        }
        .btn:hover {
            background-color: #9933ff;
            color: #ffffff;
            box-shadow: 0 0 25px #9933ff;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            from { text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #00ffcc; }
            to { text-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc, 0 0 60px #00ffcc, 0 0 90px #00ffcc; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YOU WON.... but at what cost</h1>
        <p>You must of had gone insane because of this loll</p>
        <a href="https://yfxr.qzz.io/clicker/" class="btn">Play Again</a>
    </div>

</body>
</html>
